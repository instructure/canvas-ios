---
targets:
  NextGenUnitTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      APPLICATION_EXTENSION_API_ONLY: false
      ENABLE_TESTABILITY: true
    sources:
      - path: ./
        excludes:
          - ".swiftlint.yml"
    dependencies:
      - target: NextGen
      - target: Core/TestsFoundation
