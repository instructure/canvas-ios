name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    runs-on: macos-15-xlarge
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Print Hardware
        run: |
          sysctl -n machdep.cpu.brand_string || true
          sysctl -a | grep -E 'core_count|thread_count' || true
          system_profiler SPHardwareDataType || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: brew install swiftlint

      - name: Set up Xcode projects
        run: |
          make provision-ci
          make sync-ci

      - name: Run checks
        id: checks
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GIT_CLONE_COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
        run: bash .github/workflows/pr-checks/pr-checks.sh

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            pr-checks-output/
          if-no-files-found: ignore

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('ci-report.md', 'utf8');
            const marker = '<!-- ci-check-results -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
            }

      - name: Fail if checks did not pass
        if: steps.checks.outcome != 'success'
        run: exit 1
